<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thronepath · carregando</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0b0f14;color:#fff;font-family:Arial,sans-serif}
body{display:grid;place-items:center;text-align:center}
main{width:min(520px,86vw)}
h1{margin:0 0 14px;font-size:clamp(28px,7vw,52px)}
p{opacity:.78}
.bar{height:10px;border-radius:999px;background:#ffffff1a;overflow:hidden;margin-top:18px}
.fill{height:100%;width:0;background:#fff;transition:width .18s}
</style>
</head>
<body>
<main>
<h1>THRONEPATH</h1>
<p id="status">Carregando o jogo…</p>
<div class="bar"><div class="fill" id="fill"></div></div>
</main>
<script>
(async()=>{
  const files=["parts/part001.txt","parts/part002.txt","parts/part003.txt","parts/part004.txt","parts/part005.txt","parts/part006.txt","parts/part007.txt","parts/part008.txt","parts/part009.txt","parts/part010.txt","parts/part011.txt","parts/part012.txt"];
  const chunks=[];
  try{
    for(let i=0;i<files.length;i++){
      const r=await fetch(files[i],{cache:'force-cache'});
      if(!r.ok) throw new Error('Falha ao carregar '+files[i]);
      chunks.push(await r.text());
      document.getElementById('fill').style.width=((i+1)/files.length*100)+'%';
      document.getElementById('status').textContent='Carregando o jogo… '+Math.round((i+1)/files.length*100)+'%';
    }
    const game=chunks.join('');
    document.open();
    document.write(game);
    document.close();
  }catch(err){
    document.getElementById('status').textContent='Não foi possível carregar o jogo. Atualize a página.';
    console.error(err);
  }
})();
</script>
</body>
</html>
